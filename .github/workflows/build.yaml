name: Build And Test
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: build-and-test-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      id-token: write
    env:
      GRADLE_OPTS: -Dkotlin.compiler.execution.strategy=in-process -Dkotlin.incremental=false -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4500m"
      DEBUG_KEYSTORE_FILE: debug.keystore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Decode debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
      - name: Build debug APK
        env:
          CI_ABI_FILTER: ${{ github.event_name == 'pull_request' && 'arm64-v8a' || '' }}
        run: ./gradlew :app-android:assembleDebug
      - id: rename_apk
        name: Rename APK
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          REPO_SIMPLE_NAME="${REPOSITORY##*/}"
          SAFE_BRANCH="${BRANCH_NAME//\//-}"
          APK_NAME="app-${REPO_SIMPLE_NAME}-${SAFE_BRANCH}-${SHORT_SHA}.apk"

          APK_PATH=$(find app-android/build/outputs/apk/debug -name "*.apk" | head -1)
          mv "$APK_PATH" "app-android/build/outputs/apk/debug/$APK_NAME"

          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=app-android/build/outputs/apk/debug/$APK_NAME" >> "$GITHUB_OUTPUT"

      - id: upload_apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.rename_apk.outputs.apk_name }}
          path: ${{ steps.rename_apk.outputs.apk_path }}
      - id: s3_apk
        name: Compress APK for S3 upload
        env:
          EVENT_NAME: ${{ github.event_name }}
          APK_PATH: ${{ steps.rename_apk.outputs.apk_path }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            zstd -18 --long=27 -T0 -q -c "$APK_PATH" > "${APK_PATH}.zst"
            echo "path=${APK_PATH}.zst" >> "$GITHUB_OUTPUT"
          else
            echo "path=${APK_PATH}" >> "$GITHUB_OUTPUT"
          fi
      - id: upload_s3
        name: Upload APK to S3
        uses: matsudamper/actions/upload-matsudamper-s3@a1ecf81b1a0ce320824a49711e456f396e4e8fea
        continue-on-error: true
        with:
          file_path: ${{ steps.s3_apk.outputs.path }}
      - id: github_qr_artifact
        name: Upload GitHub QR artifact
        if: github.event_name == 'pull_request'
        uses: matsudamper/actions/upload-qr-code@5c2f397727eaf53708de3f663fa9b754f55d80be # v1.1.1
        with:
          url: ${{ steps.upload_apk.outputs.artifact-url }}
          output_path: qrcode-github.png
          artifact_name: apk-qr-code-github
      - id: s3_qr_artifact
        name: Upload S3 QR artifact
        if: github.event_name == 'pull_request' && steps.upload_s3.outputs.url != ''
        uses: matsudamper/actions/upload-qr-code@5c2f397727eaf53708de3f663fa9b754f55d80be # v1.1.1
        with:
          url: ${{ steps.upload_s3.outputs.url }}
          output_path: qrcode-s3.png
          artifact_name: apk-qr-code-s3
      - name: Comment APK download URL
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: apk-download
          recreate: true
          message: |
            ✅ **Debug APK is ready!**

            | Storage | 圧縮方式 | Download Link | QR Code |
            | :--- | :--- | :--- | :--- |
            | 🐙 GitHub Artifacts | zip | [Download](${{ steps.upload_apk.outputs.artifact-url }}) | [View](${{ steps.github_qr_artifact.outputs.artifact-url }}) |
            ${{ steps.upload_s3.outputs.url && format('| ☁️ S3 | zstd | [Download]({0}) | [View]({1}) |', steps.upload_s3.outputs.url, steps.s3_qr_artifact.outputs.artifact-url) || '' }}

            ---
            *Artifact Name: `${{ steps.rename_apk.outputs.apk_name }}`*
            *ABI: `arm64-v8a`*
      - name: Build release APK (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew :app-android:assembleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-apk
          path: app-android/build/outputs/apk/release/*.apk
      - run: ./gradlew :app-desktop:jvmJar
