name: Release APK (Manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Build ref (branch or tag)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    env:
      DEBUG_KEYSTORE_FILE: debug.keystore

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Decode debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore

      - name: Build release APK
        run: ./gradlew :app-android:assembleRelease

      - id: rename_apk
        name: Rename APK
        env:
          REF_NAME: ${{ inputs.ref }}
        run: |
          SAFE_REF="${REF_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          APK_NAME="app-ai-client-release-${SAFE_REF}-${SHORT_SHA}.apk"

          APK_PATH=$(find app-android/build/outputs/apk/release -name "*.apk" | head -1)
          mv "$APK_PATH" "app-android/build/outputs/apk/release/$APK_NAME"

          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=app-android/build/outputs/apk/release/$APK_NAME" >> "$GITHUB_OUTPUT"

      - id: upload_apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.rename_apk.outputs.apk_name }}
          path: ${{ steps.rename_apk.outputs.apk_path }}
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## Release APK"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Artifact | \`${{ steps.rename_apk.outputs.apk_name }}\` |"
            echo "| Ref | \`${{ inputs.ref }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Download | [GitHub Artifacts](${{ steps.upload_apk.outputs.artifact-url }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
